{% extends 'admin/base.html' %}
{% block content %}
<h4>Site Settings</h4>
<form method="post" action="{{ url_for('admin.settings') }}" class="mt-3">
  <div class="row">
    <div class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Scanner Interval (seconds)</label>
        <input type="number" class="form-control" name="scanner_interval" value="{{ scanner_interval }}" min="60">
      </div>
    </div>
    <div class="col-md-6">
      <div class="mb-3">
        <label class="form-label">Minimum Dollar Profit</label>
        <input type="number" step="0.01" class="form-control" name="min_dollar_profit" value="{{ min_dollar_profit }}">
      </div>
    </div>
  </div>
  <div class="form-check mb-3">
    <input class="form-check-input" type="checkbox" name="maintenance_mode" id="mm" {% if maintenance_mode %}checked{% endif %}>
    <label class="form-check-label" for="mm">Enable maintenance mode</label>
  </div>
  <div class="mb-3">
    <label class="form-label">Announcement Banner</label>
    <textarea class="form-control" name="announcement" rows="3">{{ announcement }}</textarea>
  </div>
  <button class="btn btn-primary" type="submit">Save Settings</button>
  <a class="btn btn-outline-secondary ms-2" href="{{ url_for('admin.index') }}">Back</a>
  <hr class="my-4">
  <h5>Scanner Status</h5>
  <div id="scanner-status" class="text-muted">Loading...</div>
</form>

<script>
  fetch('{{ url_for('admin.scanner_status') }}')
    .then(r=>r.json()).then(d=>{
      if(d.success){
        const s=d.status;
        document.getElementById('scanner-status').innerText = `Running: ${s.is_running ? 'Yes':'No'} | Thread Alive: ${s.thread_alive ? 'Yes':'No'} | Interval: ${s.scan_interval}s | Min $ Profit: ${s.min_dollar_profit}`;
      }
    });
</script>
{% endblock %}
